name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Run at 00:00 on the first day of every month
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go mod download
      - name: go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  libdns-latest:
    # The libdns.Record{Getter,Appender,Setter,Deleter} interface guards in
    # provider.go stop compiling if libdns changes an interface, so this fails
    # fast on an upstream break instead of waiting for a downstream report.
    name: Build against libdns@latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Bump libdns to latest and build
        run: |
          go get github.com/libdns/libdns@latest
          go build ./...
          go vet ./...
