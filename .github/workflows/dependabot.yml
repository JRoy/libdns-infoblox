name: dependabot

# Gate for Dependabot's auto-merged PRs. This module only reaches Caddy through
# the caddydns-infoblox plugin, so build Caddy via xcaddy with that plugin and
# this module replaced by the PR checkout, then confirm the DNS provider still
# registers. If a bump breaks the Caddy build, this check fails and the PR does
# not merge.
on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  xcaddy:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
      - name: Build Caddy with the versions this PR proposes
        run: |
          xcaddy build \
            --with github.com/JRoy/caddydns-infoblox \
            --with github.com/JRoy/libdns-infoblox="$PWD" \
            --output ./caddy
      - name: DNS provider module is registered
        run: ./caddy list-modules | grep -qE '(^|\s)dns\.providers\.infoblox(\s|$)'
      # Reached only if every step above passed. Enables GitHub auto-merge on
      # the PR; GitHub merges it once required checks are green.
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
